name: CI

on:
  push:
    branches: [main]
  pull_request:

# The eval gate is its own workflow, `evals.yml`. It stays separate because it
# spends real money on a shared account and so runs on a narrow `paths` filter,
# while this one must run on every push and every PR.
jobs:
  verify:
    name: typecheck + test + lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Lint
        run: npm run lint
