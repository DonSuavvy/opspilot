name: CI

on:
  push:
    branches: [main]
  pull_request:

# Day 8 adds a second job here: the eval suite runs on any PR touching
# prompts/ or sops/, posts a scorecard comment, and fails on regression.
jobs:
  verify:
    name: typecheck + test + lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Lint
        run: npm run lint
