# Local Postgres for development and for verifying the seed script without
# touching Neon. Port 5434: 5432 is the usual host Postgres and 5433 is taken
# by the legal-dms project on this machine.
services:
  postgres:
    image: postgres:17-alpine
    container_name: opspilot-postgres
    environment:
      POSTGRES_USER: opspilot
      POSTGRES_PASSWORD: opspilot
      POSTGRES_DB: opspilot
    ports:
      - "5434:5432"
    volumes:
      - opspilot-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opspilot -d opspilot"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  opspilot-pgdata:
